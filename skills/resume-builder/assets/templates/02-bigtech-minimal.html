<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} - 个人简历(大厂极简风)</title>
<style>
  /* 变体 02:大厂极简风 —— 单栏、高密度、白底黑字、只留必要装饰 */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    background:#f5f5f7; color:#1a1a2e;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .page {
    width:210mm; min-height:297mm; margin:20px auto; background:#fff;
    padding:30px 40px; box-shadow:0 2px 16px rgba(0,0,0,.08);
  }
  @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:auto} }
  .head { border-bottom:1px solid #e5e7eb; padding-bottom:12px; margin-bottom:16px; }
  .name { font-size:30px; font-weight:800; letter-spacing:2px; }
  .titles { margin-top:6px; }
  .tag { display:inline-block; font-size:12px; color:#4a5568; background:#f0f2f5; border-radius:3px; padding:2px 10px; margin-right:6px; font-weight:600; }
  .tag.gold { background:#1a1a2e; color:#fff; }
  .contact { font-size:12px; color:#888; margin-top:8px; }
  .honor-bar { display:block; background:#e63946; color:#fff; border-radius:3px; padding:7px 12px; font-size:13px; font-weight:700; margin-top:12px; }
  h2 { font-size:15px; margin:18px 0 8px; letter-spacing:2px; position:relative; padding-bottom:5px; }
  h2::after { content:""; position:absolute; left:0; bottom:0; width:36px; height:2px; background:#1a1a2e; }
  .edu { font-size:12.5px; line-height:1.8; display:flex; justify-content:space-between; }
  .edu b { font-size:13.5px; }
  .edu .detail { color:#666; }
  .edu .time { color:#aaa; white-space:nowrap; }
  .company { margin:12px 0 6px; }
  .company .co { font-size:14px; font-weight:700; }
  .company .role { font-size:12px; color:#666; margin-left:8px; }
  .company .time { float:right; font-size:11.5px; color:#aaa; }
  .project { margin:8px 0 12px; }
  .project .pname { font-size:12.5px; font-weight:700; margin-bottom:3px; }
  .badge { font-size:10px; background:#eef2ff; color:#325AB4; border-radius:8px; padding:1px 7px; margin-left:5px; }
  .project li { font-size:11.8px; line-height:1.65; margin-left:1.2em; color:#333; }
  .metric { color:#e63946; font-weight:700; }
  .hl { font-weight:800; }
  .honor li { font-size:12.3px; line-height:1.8; margin-left:1.2em; }
  .honor-hl { color:#e63946; font-weight:800; }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="name">{{NAME}}</div>
    <div class="titles">{{TITLE_TAGS}}</div>
    <div class="contact">{{CONTACT}}</div>
    <span class="honor-bar">★ {{HONOR_BAR}}</span>
  </div>
  <h2>教育背景</h2>
  <div class="edu">
    <div><b>{{EDU_SCHOOL}}</b> <span class="detail">{{EDU_DETAIL}}</span></div>
    <div class="time">{{EDU_TIME}}</div>
  </div>
  <h2>实习经历</h2>
  {{EXPERIENCE_BLOCKS}}
  <h2>荣誉 / 外部认可</h2>
  <ul class="honor">
    <li><span class="honor-hl">{{HONOR_HL}}</span></li>
    {{HONOR_LIST}}
  </ul>
</div>
</body>
</html>
