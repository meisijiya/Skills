<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} - 个人简历(极简科技风)</title>
<style>
  /* 变体 01:极简科技风 —— 左侧信息栏 + 右侧内容区 */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    background:#f0f2f5; color:#1a1a2e;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .page {
    width:210mm; min-height:297mm; margin:20px auto; background:#fff;
    display:grid; grid-template-columns: 62mm 1fr;
    box-shadow:0 2px 16px rgba(0,0,0,.08);
  }
  @media print { body{background:#fff} .page{margin:0;box-shadow:none} }
  /* 左侧 */
  .sidebar {
    background:#1a1a2e; color:#fff; padding:26px 18px;
  }
  .sidebar .avatar { font-size:26px; font-weight:800; letter-spacing:1px; margin-bottom:18px; }
  .sidebar .sec-title {
    font-size:12px; letter-spacing:2px; color:#8ba3c7;
    border-bottom:1px solid #325AB4; padding-bottom:5px; margin:18px 0 8px;
  }
  .sidebar p, .sidebar li { font-size:11px; line-height:1.7; color:#c5d3e8; list-style:none; }
  .sidebar ul { margin:0; padding:0; }
  .sidebar .hl { color:#ffd700; font-weight:700; }
  /* 右侧 */
  .main { padding:26px 26px; }
  .main .name { font-size:28px; font-weight:800; letter-spacing:3px; }
  .main .titles { margin:6px 0 14px; }
  .main .tag {
    display:inline-block; background:#eef2ff; color:#325AB4; font-size:11px;
    border-radius:12px; padding:2px 10px; margin-right:6px; font-weight:600;
  }
  .main .tag.gold { background:#fff8e1; color:#b8860b; border:1px solid #e6c200; }
  h2 {
    font-size:14px; margin:18px 0 8px; padding-left:8px;
    border-left:4px solid #325AB4; letter-spacing:1px;
  }
  .edu { font-size:12px; line-height:1.8; }
  .company { margin-bottom:12px; }
  .company .co { font-size:13px; font-weight:700; color:#1a1a2e; }
  .company .time { float:right; font-size:11px; color:#888; }
  .project { margin:6px 0 10px; }
  .project .pname { font-size:12px; font-weight:700; margin-bottom:3px; }
  .badge { font-size:10px; background:#f0f2f5; border-radius:8px; padding:1px 7px; color:#4a5568; margin-left:5px; }
  .project li { font-size:11.5px; line-height:1.6; margin-left:1.1em; }
  .metric { color:#325AB4; font-weight:700; }
  .hl { color:#e67e22; font-weight:700; }
  .honor li { font-size:12px; line-height:1.8; margin-left:1.1em; }
  .honor-hl { color:#e63946; font-weight:800; }
</style>
</head>
<body>
<div class="page">
  <div class="sidebar">
    <div class="avatar">{{NAME}}</div>
    <div class="sec-title">联系方式</div>
    <ul>
      <li>{{CONTACT_LINE1}}</li>
      <li>{{CONTACT_LINE2}}</li>
      <li>{{CONTACT_LINE3}}</li>
    </ul>
    <div class="sec-title">核心标签</div>
    <ul>{{SIDEBAR_TAGS}}</ul>
    <div class="sec-title">技能栈</div>
    <ul>{{SKILL_LIST}}</ul>
  </div>
  <div class="main">
    <div class="name">{{NAME}}</div>
    <div class="titles">
      {{TITLE_TAGS}}
    </div>
    {{MAIN_BODY}}
  </div>
</div>
</body>
</html>
